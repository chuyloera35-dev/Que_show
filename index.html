<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e54">
  <title>Qué Show</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">💬</div>
        <div>
          <h1>Qué Show</h1>
          <span>Mensajería</span>
        </div>
      </div>

      <button id="menuBtn" class="icon-btn" type="button">⋮</button>
    </header>

    <main id="mainScreen">

      <section class="search-area">
        <input
          id="searchInput"
          type="search"
          placeholder="Buscar chats..."
          autocomplete="off"
        >
      </section>

      <section class="tabs" aria-label="Secciones">
        <button class="tab active" data-tab="chats" type="button">
          Chats
        </button>

        <button class="tab" data-tab="status" type="button">
          Estados
        </button>

        <button class="tab" data-tab="calls" type="button">
          Llamadas
        </button>
      </section>

      <section id="content">

        <div id="chatsView" class="view active">
          <div id="chatList"></div>

          <div id="emptyChats" class="empty hidden">
            <div class="empty-icon">💬</div>
            <h2>No hay chats</h2>
            <p>Cuando tengas conversaciones aparecerán aquí.</p>
          </div>
        </div>

        <div id="statusView" class="view">
          <div class="empty">
            <div class="empty-icon">⭕</div>
            <h2>Estados</h2>
            <p>Próximamente podrás compartir estados.</p>
          </div>
        </div>

        <div id="callsView" class="view">
          <div class="empty">
            <div class="empty-icon">📞</div>
            <h2>Llamadas</h2>
            <p>Aquí aparecerá tu historial de llamadas.</p>
          </div>
        </div>

      </section>

    </main>

    <section id="chatScreen" class="chat-screen hidden">

      <header class="chat-header">

        <button id="backBtn" class="icon-btn" type="button">
          ←
        </button>

        <div id="chatAvatar" class="avatar">Q</div>

        <div class="chat-user">
          <strong id="chatUserName">Contacto</strong>
          <span id="chatUserStatus">en línea</span>
        </div>

        <button id="voiceCallBtn" class="icon-btn" type="button">
          📞
        </button>

        <button id="videoCallBtn" class="icon-btn" type="button">
          📹
        </button>

      </header>

      <div id="messages" class="messages"></div>

      <form id="messageForm" class="message-form">

        <button id="emojiBtn" class="emoji-btn" type="button">
          😊
        </button>

        <input
          id="messageInput"
          type="text"
          placeholder="Escribe un mensaje..."
          autocomplete="off"
        >

        <button class="send-btn" type="submit">
          ➤
        </button>

      </form>

    </section>

    <button id="newChatBtn" class="new-chat" type="button">
      ✏️
    </button>

  </div>

  <div id="menuModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeMenuBtn" class="modal-close" type="button">
        ✕
      </button>

      <h2>Qué Show</h2>
      <p>Aplicación de mensajería.</p>

      <button id="profileBtn" class="modal-option" type="button">
        👤 Mi perfil
      </button>

      <button id="settingsBtn" class="modal-option" type="button">
        ⚙️ Configuración
      </button>
    </div>
  </div>

  <div id="callModal" class="modal hidden">

    <div class="call-box">

      <div id="callAvatar" class="call-avatar">Q</div>

      <h2 id="callName">Contacto</h2>

      <p id="callType">Llamando...</p>

      <button id="endCallBtn" class="end-call" type="button">
        ☎
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
  </html>
